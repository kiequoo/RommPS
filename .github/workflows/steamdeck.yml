# Builds, tests and packages RommDeck, the Steam Deck app, and RomM Sync for
# the Deck (tools/deck-ci.sh), from the copy s0liton/RommDeck gets
# (tools/rommdeck-copy.sh) rather than from this checkout: RommDeck builds and
# releases from that copy, so a change that breaks it there, or a file the copy
# leaves out, fails here first. Linting is lint.yml's job.
#
# Builds for x86_64 and aarch64. x86_64 runs on ubuntu-latest; aarch64 runs on
# ubuntu-24.04-arm (native, no qemu). The x86_64 artifact is named "steamdeck"
# for backward compatibility with rommdeck-release.yml; aarch64 is "steamdeck-aarch64".
#
# The packages end up as the artifacts above; this workflow never touches
# a release. ci.yml runs it on pushes and pull requests.
name: RommDeck

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "Version baked in and in the file names: 1.5.0 (a leading v is dropped)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            runtime_url: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
            artifact: steamdeck
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage
            runtime_url: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64
            artifact: steamdeck-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      COPY: ${{ github.workspace }}/rommdeck
      ARCH: ${{ matrix.arch }}
      DECK_PLATFORM: ${{ matrix.platform }}
      DECK_IMAGE: romm-sync-deck-${{ matrix.arch }}:6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: rommps

      - name: Copy what RommDeck gets
        id: copy
        run: |
          rommps/tools/rommdeck-copy.sh "$COPY"
          # The image tools/deck-build.sh runs, so the one built below is the one it finds.
          image=$(sed -n 's/^IMAGE="${DECK_IMAGE:-\(.*\)}"$/\1/p' "$COPY/tools/deck-build.sh")
          [ -n "$image" ] || { echo "::error::tools/deck-build.sh names no image"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      # The cache only saves time, so failing to write it must not fail the build.
      - uses: docker/build-push-action@v6
        with:
          context: rommdeck/platform/steamdeck/app/docker
          platforms: ${{ matrix.platform }}
          build-args: |
            APPIMAGETOOL_URL=${{ matrix.appimagetool_url }}
            RUNTIME_URL=${{ matrix.runtime_url }}
          tags: ${{ env.DECK_IMAGE }}
          load: true
          cache-from: type=gha,scope=steamdeck-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=steamdeck-${{ matrix.arch }},ignore-error=true

      - name: Build, test and package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          "$COPY/tools/deck-ci.sh" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rommdeck/build/steamdeck/release/
          if-no-files-found: error
