# Builds RommDeck, the Steam Deck app, and RomM Sync for the Deck, in the image
# tools/deck-build.sh uses (platform/steamdeck/app/docker), then tests and
# packages them (linting is lint.yml's job):
#
#   tests/steamdeck*.sh  the Deck's sync service on RetroDECK, EmuDeck and standalone layouts, against the mock RomM
#   package.sh           rommdeck-<version>-<arch>.tar.gz and RommDeck-<version>-<arch>.AppImage
#                        (with its .zsync, for AppImageUpdate and Gear Lever),
#                        RommDeck-Installer.desktop and rommdeck-installer.sh, plus
#                        romm-sync-steamdeck (the service alone, for in-app updates)
#   tests/steamdeck_install.sh  the installer, with that AppImage, against a fake release
#
# Builds for x86_64 and aarch64. x86_64 runs on ubuntu-latest; aarch64 runs on
# ubuntu-24.04-arm (native, no qemu). The x86_64 artifact is named "steamdeck"
# for backward compatibility with rommdeck-release.yml; aarch64 is "steamdeck-aarch64".
#
# The packages end up as the artifacts above; this workflow never touches
# a release. ci.yml runs it on pushes and pull requests, rommdeck-release.yml
# before publishing to s0liton/RommDeck.
name: RommDeck

on:
  workflow_call:
    inputs:
      sha:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "Version baked in and in the file names: 1.5.0 (a leading v is dropped)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            runtime_url: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
            artifact: steamdeck
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage
            runtime_url: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64
            artifact: steamdeck-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      DECK_PLATFORM: ${{ matrix.platform }}
      # The tag tools/deck-build.sh runs; keep the two in step.
      DECK_IMAGE: romm-sync-deck-${{ matrix.arch }}:6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/setup-buildx-action@v3

      # The cache only saves time, so failing to write it must not fail the build.
      - uses: docker/build-push-action@v6
        with:
          context: platform/steamdeck/app/docker
          platforms: ${{ matrix.platform }}
          build-args: |
            APPIMAGETOOL_URL=${{ matrix.appimagetool_url }}
            RUNTIME_URL=${{ matrix.runtime_url }}
          tags: ${{ env.DECK_IMAGE }}
          load: true
          cache-from: type=gha,scope=steamdeck-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=steamdeck-${{ matrix.arch }},ignore-error=true

      - name: Build
        run: |
          tools/deck-build.sh make steamdeck VERSION="${VERSION#v}"
          ROMMPS_PAYLOAD_VERSION="${VERSION#v}" tools/deck-build.sh bash -c 'cmake -S platform/steamdeck/app -B build/steamdeck/app -G Ninja \
            && cmake --build build/steamdeck/app'

      # RetroDECK, EmuDeck and standalone layouts, each against the mock RomM.
      - name: Test the sync service on the Deck's layouts
        run: |
          for t in steamdeck steamdeck_emus steamdeck_x360_vita steamdeck_saves2 steamdeck_duckstation; do
            echo "::group::$t"
            tools/deck-build.sh "tests/$t.sh" || { echo "::error::tests/$t.sh failed"; exit 1; }
            echo "::endgroup::"
          done

      - name: Package
        run: |
          tools/deck-build.sh platform/steamdeck/package.sh "${VERSION#v}" build/steamdeck/release
          # The service on its own too, for its in-app updates (src/update.c).
          cp build/steamdeck/romm-sync build/steamdeck/release/romm-sync-steamdeck

      # Install, update and uninstall with the AppImage just packaged, served as a fake release.
      - name: Test the installer
        run: tools/deck-build.sh tests/steamdeck_install.sh build/steamdeck/release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/steamdeck/release/
          if-no-files-found: error
